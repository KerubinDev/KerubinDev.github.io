<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelvin Moraes | Kerubin - Portfolio Disruptivo</title>
    <meta name="description"
        content="Portfolio dual de Kelvin Moraes (Kerubin): A sinergia entre o Código (Red Pill) e o Design (Blue Pill).">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body class="loading">
    <div id="app">
        <!-- Overlay de Transição -->
        <div id="dimension-overlay"></div>

        <!-- Landing Page (The Void) -->
        <section id="the-void" class="active">
            <canvas id="canvas-3d"></canvas>
            <div class="split-screen">
                <div class="split-side red" id="side-red">
                    <div class="side-content">
                        <h2>SYSTEM</h2>
                        <span class="pill-label">RED PILL</span>
                    </div>
                </div>

                <div class="split-side blue" id="side-blue">
                    <div class="side-content">
                        <h2>DESIGN</h2>
                        <span class="pill-label">BLUE PILL</span>
                    </div>
                </div>

                <div class="morpheus-container">
                    <img src="./img/image-removebg-preview.png" alt="Kelvin Moraes - Morpheus" class="morpheus-img">
                </div>
            </div>
            <div class="instruction">
                <p>ESCOLHA SUA REALIDADE</p>
            </div>
        </section>

        <!-- Main Content Area -->
        <main id="main-content" class="hidden">
            <!-- Content will be dynamically injected or unhidden based on side -->
        </main>
    </div>
    <script type="module" src="./src/main.ts"></script>
</body>

</html>
